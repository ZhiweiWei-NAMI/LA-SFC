base_config: lasdm_airfogsim.yaml

experiment:
  name: lasdm_sensitivity
  mode: offline
  baselines:
    - lasdm_greedy
    - proposed
  seeds: [0, 1, 2]

sensitivity:
  deadline:
    tight:
      deadline_s: 1.2
    medium:
      deadline_s: 3.0
    loose:
      deadline_s: 12.0
  network:
    stable:
      network_fault: none
      risk_level: 0.2
      network_latency_multiplier: 1.0
    degraded:
      network_fault: intermittent_v2u
      risk_level: 0.5
      network_latency_multiplier: 1.35
    burst:
      network_fault: burst
      risk_level: 0.75
      network_latency_multiplier: 1.8
  load:
    low:
      load_multiplier: 0.7
    medium:
      load_multiplier: 1.0
    high:
      load_multiplier: 2.0

output:
  root_dir: experiment_artifacts/raw_data/lasdm_sensitivity
  write_manifest: true
  write_per_run_json: true
  write_summary_csv: true
  write_aggregate_csv: true
  write_sensitivity_summary_csv: true
  overwrite: false
