schema_version: lasdm.airfogsim.v1

orchestrator:
  score_weights:
    health: 2.0
    reliability: 2.0
    accuracy: 1.0
    trust: 1.0
    region: 0.5
    resource_headroom: 0.0
    load: 0.0
    cold_start: 0.0

service_instances:
  - instance_id: rsu0_preprocess_local
    service_id: video_preprocess
    node_id: RSU_0
    node_type: rsu
    region_id: RSU_0
    capabilities: [video_preprocess, keyframe]
    input_semantic: video
    output_semantic: keyframes
    capacity: {cpu: 80.0, memory: 32768.0, storage: 20000.0}
    used: {cpu: 6.0, memory: 1024.0, storage: 512.0}
    max_concurrency: 6
    reliability_score: 0.93
    accuracy_score: 0.915
    trust_score: 0.955
    cold_start_s: 0.12

  - instance_id: uav0_preprocess_local
    service_id: video_preprocess
    node_id: UAV_0
    node_type: uav
    region_id: RSU_0
    capabilities: [video_preprocess, keyframe]
    input_semantic: video
    output_semantic: keyframes
    capacity: {cpu: 4.0, memory: 1024.0, storage: 1024.0}
    used: {cpu: 0.5, memory: 384.0, storage: 256.0}
    max_concurrency: 2
    reliability_score: 0.93
    accuracy_score: 0.91
    trust_score: 0.96
    cold_start_s: 0.08

  - instance_id: rsu1_preprocess_balanced
    service_id: video_preprocess
    node_id: RSU_1
    node_type: rsu
    region_id: RSU_1
    capabilities: [video_preprocess, keyframe]
    input_semantic: video
    output_semantic: keyframes
    capacity: {cpu: 80.0, memory: 32768.0, storage: 20000.0}
    used: {cpu: 4.0, memory: 1024.0, storage: 512.0}
    max_concurrency: 6
    reliability_score: 0.985
    accuracy_score: 0.965
    trust_score: 0.99
    cold_start_s: 0.18

  - instance_id: uav1_preprocess_remote
    service_id: video_preprocess
    node_id: UAV_1
    node_type: uav
    region_id: RSU_1
    capabilities: [video_preprocess, keyframe]
    input_semantic: video
    output_semantic: keyframes
    capacity: {cpu: 4.0, memory: 2048.0, storage: 4096.0}
    used: {cpu: 0.4, memory: 512.0, storage: 512.0}
    max_concurrency: 2
    reliability_score: 0.975
    accuracy_score: 0.955
    trust_score: 0.985
    cold_start_s: 0.15

  - instance_id: rsu0_detect_local
    service_id: object_detection
    node_id: RSU_0
    node_type: rsu
    region_id: RSU_0
    capabilities: [object_detection, lightweight_inference]
    input_semantic: keyframes
    output_semantic: detection_result
    capacity: {cpu: 80.0, memory: 32768.0, storage: 20000.0}
    used: {cpu: 8.0, memory: 2048.0, storage: 2048.0}
    max_concurrency: 6
    reliability_score: 0.925
    accuracy_score: 0.915
    trust_score: 0.955
    cold_start_s: 0.18

  - instance_id: rsu1_detect_balanced
    service_id: object_detection
    node_id: RSU_1
    node_type: rsu
    region_id: RSU_1
    capabilities: [object_detection, lightweight_inference]
    input_semantic: keyframes
    output_semantic: detection_result
    capacity: {cpu: 80.0, memory: 32768.0, storage: 20000.0}
