schema_version: lasdm.semantic.implementations.v21
dataset_id: v21_unseen_sfc_profiles
service_type_count: 16
implementation_count: 80

implementations:
  - implementation_id: aerial_rgb_stabilizer_v2
    service_type: aerial_video_preprocessing
    model_family: opencv_gstreamer
    model_version: v2
    semantic_variant_type: exact
    compatible_node_types: [uav, rsu, edge_server]
    semantic_profile:
      description: >
        This pipeline stabilizes aerial RGB video for low altitude monitoring by
        removing platform jitter, correcting exposure drift, and reducing light
        haze before any detection stage sees the frames.
      input_semantic: >
        It expects raw RGB video from a moving UAV camera, including small roll
        changes, motion blur, and compression noise typical of airborne links.
      output_semantic: >
        It returns frame aligned RGB clips with steadier geometry and cleaner
        color balance so downstream detectors can compare objects across time.
    domain:
      primary_domains: [aerial, surveillance, rgb]
      secondary_domains: [traffic, security, wildfire]
      unsuitable_domains: [flatbed_scanning, document_ocr, medical_imaging]
    capabilities: [video_stabilization, dehaze, exposure_correction, rgb_preprocess]
    performance_profile:
      typical_inference_time_ms: 14
      typical_accuracy_f1: 0.94
      false_positive_rate: 0.03
      false_negative_rate: 0.04
      throughput_fps: 36
      robustness_notes: >
        It is reliable on daylight aerial footage but loses quality when frames
        are badly underexposed or when motion blur is already severe.
    resource_profile:
      min_compute_cpu: 2.0
      min_memory_mb: 768
      min_storage_mb: 256
      recommended_accelerator: none
      model_size_mb: 18

  - implementation_id: aerial_hdr_restorer_v1
    service_type: aerial_video_preprocessing
    model_family: unet_restoration
    model_version: v1
    semantic_variant_type: equivalent
    compatible_node_types: [rsu, edge_server]
    semantic_profile:
      description: >
        This restoration model prepares aerial RGB video by lifting shadowed
        regions and compressing bright sky highlights, which preserves small
        scene details that standard stabilization pipelines often wash out.
      input_semantic: >
        It expects stabilized or near stabilized RGB aerial frames where the
        main problem is dynamic range loss rather than strong platform motion.
      output_semantic: >
        It emits visually balanced RGB frames whose local contrast is more
        uniform, allowing later detectors to keep weak object evidence.
    domain:
      primary_domains: [aerial, rgb, illumination_recovery]
      secondary_domains: [traffic, urban_security]
      unsuitable_domains: [thermal, scanned_pages, xray]
    capabilities: [hdr_recovery, contrast_restoration, rgb_preprocess]
    performance_profile:
      typical_inference_time_ms: 26
      typical_accuracy_f1: 0.91
      false_positive_rate: 0.05
      false_negative_rate: 0.06
      throughput_fps: 18
      robustness_notes: >
        It helps in backlit scenes but is less stable than the exact pipeline on
        hard UAV vibration or rapid yaw.
    resource_profile:
      min_compute_cpu: 3.0
      min_memory_mb: 1536
      min_storage_mb: 512
      recommended_accelerator: gpu
      model_size_mb: 42

  - implementation_id: general_video_denoise_pipeline_v3
    service_type: aerial_video_preprocessing
    model_family: ffmpeg_filtergraph
    model_version: v3
    semantic_variant_type: compatible
    compatible_node_types: [uav, rsu, edge_server]
    semantic_profile:
      description: >
        This general video cleanup stack denoises, sharpens, and mildly smooths
        compressed frames, which makes it usable for aerial workloads even
        though it was not tuned around flight dynamics.
      input_semantic: >
        It expects noisy RGB video with visible codec artifacts and only modest
        geometric instability in the source stream.
      output_semantic: >
        It produces cleaner RGB frames with fewer blocking artifacts, but it
        does not guarantee strict frame to frame motion consistency.
    domain:
      primary_domains: [generic_video, rgb]
      secondary_domains: [aerial, traffic, security]
      unsuitable_domains: [thermal, document_rectification, microscopy]
    capabilities: [video_denoise, artifact_reduction, rgb_preprocess]
    performance_profile:
      typical_inference_time_ms: 11
      typical_accuracy_f1: 0.86
      false_positive_rate: 0.07
      false_negative_rate: 0.09
      throughput_fps: 42
      robustness_notes: >
        It is fast and easy to deploy, but weak motion handling limits its
        benefit on footage from aggressive UAV maneuvers.
    resource_profile:
      min_compute_cpu: 1.5
      min_memory_mb: 512
      min_storage_mb: 256
      recommended_accelerator: none
      model_size_mb: 9

  - implementation_id: bodycam_video_cleaner_v1
    service_type: aerial_video_preprocessing
    model_family: mobile_enhance
    model_version: v1
    semantic_variant_type: weak
    compatible_node_types: [uav, rsu]
    semantic_profile:
      description: >
        This cleaner was built for chest mounted security cameras and can still
        improve low altitude footage, but its motion assumptions follow human
        walking patterns rather than airborne motion.
      input_semantic: >
        It expects short RGB clips with modest shake, near eye level viewpoints,
        and relatively close foreground subjects.
      output_semantic: >
        It returns smoothed RGB video that looks cleaner to a person, yet it can
        blur distant aerial targets that later models need to preserve.
    domain:
      primary_domains: [wearable_security, rgb]
      secondary_domains: [urban_patrol, indoor_surveillance]
      unsuitable_domains: [wildfire_aerial, thermal, industrial_macro]
    capabilities: [video_cleanup, mild_stabilization, rgb_preprocess]
    performance_profile:
      typical_inference_time_ms: 9
      typical_accuracy_f1: 0.78
      false_positive_rate: 0.11
      false_negative_rate: 0.14
      throughput_fps: 44
      robustness_notes: >
        It runs cheaply but often oversmooths tiny aerial targets and does not
        correct the perspective changes seen in UAV footage.
    resource_profile:
      min_compute_cpu: 1.0
      min_memory_mb: 384
      min_storage_mb: 128
      recommended_accelerator: none
      model_size_mb: 6

  - implementation_id: document_scanner_rectifier_v1
    service_type: aerial_video_preprocessing
    model_family: ocr_preprocess
    model_version: v1
    semantic_variant_type: mismatch
    compatible_node_types: [rsu, edge_server]
    semantic_profile:
      description: >
        This rectifier tries to flatten perspective and maximize text contrast,
        which is useful for scanned forms but semantically wrong for open scene
        aerial video where objects must keep their real geometry.
      input_semantic: >
        It expects near planar images of documents with strong page borders and
        stable backgrounds rather than outdoor moving scenes.
      output_semantic: >
        It emits aggressively warped frames that emphasize edges and corners,
        destroying the spatial continuity needed for tracking or detection.
    domain:
      primary_domains: [document_ocr, planar_rectification]
      secondary_domains: [receipt_capture]
      unsuitable_domains: [aerial, traffic, urban_security, wildfire]
    capabilities: [perspective_rectification, edge_boost, text_contrast]
    performance_profile:
      typical_inference_time_ms: 19
      typical_accuracy_f1: 0.33
      false_positive_rate: 0.32
      false_negative_rate: 0.41
      throughput_fps: 20
      robustness_notes: >
        It executes correctly as software, but its outputs are structurally
        misleading for every downstream aerial analytics task in this dataset.
    resource_profile:
      min_compute_cpu: 2.0
      min_memory_mb: 1024
      min_storage_mb: 256
      recommended_accelerator: none
      model_size_mb: 14

  - implementation_id: wildfire_thermal_nuc_v2
    service_type: thermal_frame_preprocessing
    model_family: thermal_calibration_net
    model_version: v2
    semantic_variant_type: exact
    compatible_node_types: [uav, rsu, edge_server]
    semantic_profile:
      description: >
        This thermal preprocessing stack corrects non uniformity, dead pixels,
        and temperature drift in airborne infrared frames collected during
        wildfire patrol and night monitoring.
      input_semantic: >
        It expects raw long wave infrared frames from an aerial thermal sensor,
        including gain drift and hot pixel noise caused by changing ambient
        temperature and platform vibration.
      output_semantic: >
        It returns calibrated heat imagery with stable contrast and preserved
        hot spot boundaries so fire reasoning stages can trust the signal.
    domain:
      primary_domains: [thermal, wildfire, aerial]
      secondary_domains: [night_monitoring, industrial_heat]
      unsuitable_domains: [rgb_only, document_ocr, ultrasound]
    capabilities: [thermal_calibration, dead_pixel_repair, heat_contrast]
    performance_profile:
      typical_inference_time_ms: 17
      typical_accuracy_f1: 0.95
      false_positive_rate: 0.03
      false_negative_rate: 0.04
      throughput_fps: 28
      robustness_notes: >
        It is stable under changing ambient conditions, but severe sensor bloom
        around very large flames can still reduce boundary accuracy.
    resource_profile:
      min_compute_cpu: 2.0
      min_memory_mb: 768
      min_storage_mb: 256
      recommended_accelerator: none
      model_size_mb: 20

  - implementation_id: thermal_contrast_enhancer_v1
    service_type: thermal_frame_preprocessing
    model_family: clahe_ir
    model_version: v1
    semantic_variant_type: equivalent
    compatible_node_types: [uav, rsu]
    semantic_profile:
      description: >
        This enhancer improves local thermal contrast and suppresses banding,
        giving downstream models a cleaner view when the main problem is flat
        dynamic range rather than severe calibration drift.
      input_semantic: >
        It expects thermal frames that are already roughly calibrated but still
        lack contrast between background terrain and hot structures.
      output_semantic: >
        It emits high contrast thermal frames that highlight gradients and warm
        contours, which is often enough for later segmentation or detection.
    domain:
      primary_domains: [thermal, contrast_recovery]
      secondary_domains: [wildfire, industrial_inspection]
      unsuitable_domains: [rgb, text_scan, lidar]
    capabilities: [thermal_enhancement, contrast_equalization]
    performance_profile:
      typical_inference_time_ms: 10
      typical_accuracy_f1: 0.89
      false_positive_rate: 0.06
      false_negative_rate: 0.07
      throughput_fps: 40
      robustness_notes: >
        It is efficient on edge hardware but cannot correct deeper sensor drift
        that accumulates during long flights.
    resource_profile:
      min_compute_cpu: 1.5
      min_memory_mb: 512
      min_storage_mb: 128
      recommended_accelerator: none
      model_size_mb: 8

  - implementation_id: industrial_ir_cleanup_v3
    service_type: thermal_frame_preprocessing
    model_family: sensor_cleaning_rules
    model_version: v3
    semantic_variant_type: compatible
    compatible_node_types: [rsu, edge_server]
    semantic_profile:
      description: >
        This cleanup pipeline was built for fixed industrial infrared cameras,
        but it can still prepare thermal frames for aerial inspection if the
        motion between frames remains moderate.
      input_semantic: >
        It expects infrared frames with periodic noise and known sensor gain
        settings, usually from mounted cameras observing steady equipment.
      output_semantic: >
        It produces cleaner heat maps and removes repeating noise patterns, but
        it does not explicitly model airborne motion or rapid viewpoint change.
    domain:
      primary_domains: [industrial_thermal, infrared]
      secondary_domains: [inspection, wildfire]
      unsuitable_domains: [rgb, underwater, microscopy]
    capabilities: [thermal_denoise, gain_cleanup, noise_filter]
    performance_profile:
      typical_inference_time_ms: 13
      typical_accuracy_f1: 0.84
      false_positive_rate: 0.08
      false_negative_rate: 0.1
      throughput_fps: 32
      robustness_notes: >
        It performs acceptably on calm aerial scans, but fast panning can leave
        ghost artifacts that later detectors may misread.
    resource_profile:
      min_compute_cpu: 2.0
      min_memory_mb: 768
      min_storage_mb: 256
      recommended_accelerator: none
      model_size_mb: 11

  - implementation_id: building_heatmap_smoother_v1
    service_type: thermal_frame_preprocessing
    model_family: heatmap_smoother
    model_version: v1
    semantic_variant_type: weak
    compatible_node_types: [rsu, edge_server]
    semantic_profile:
      description: >
        This smoother targets slow changing building heat maps and can reduce
        flicker, but it assumes mostly static scenes and therefore softens small
        moving hot spots that matter in wildfire patrol.
      input_semantic: >
        It expects thermal imagery from fixed building surveys with limited
        motion, regular facades, and long dwell time on each target.
      output_semantic: >
        It returns visually calm thermal fields that favor broad temperature
        trends over sharp event boundaries or tiny isolated anomalies.
    domain:
      primary_domains: [building_energy_audit, thermal]
      secondary_domains: [facility_inspection]
      unsuitable_domains: [wildfire_aerial, high_motion_thermal, rgb]
    capabilities: [temporal_smoothing, thermal_cleanup]
    performance_profile:
      typical_inference_time_ms: 8
      typical_accuracy_f1: 0.72
      false_positive_rate: 0.11
      false_negative_rate: 0.16
      throughput_fps: 48
      robustness_notes: >
        It is cheap to run, but boundary smoothing causes missed early hot spots
        when anomalies are small and moving.
    resource_profile:
      min_compute_cpu: 1.0
      min_memory_mb: 384
      min_storage_mb: 128
      recommended_accelerator: none
      model_size_mb: 5

  - implementation_id: rgb_color_grader_v2
    service_type: thermal_frame_preprocessing
    model_family: color_grade_cnn
    model_version: v2
    semantic_variant_type: mismatch
    compatible_node_types: [uav, rsu]
    semantic_profile:
      description: >
        This model enhances visible color footage and has no thermal calibration
        semantics, so using it on infrared inputs would only create misleading
        pseudo color artifacts.
      input_semantic: >
        It expects standard RGB imagery with three visible channels and natural
        color relationships rather than radiometric thermal measurements.
      output_semantic: >
        It emits color graded frames whose numeric values no longer correspond
        to real temperature structure, which breaks downstream heat reasoning.
    domain:
      primary_domains: [rgb_enhancement, color_video]
      secondary_domains: [consumer_video]
      unsuitable_domains: [thermal, wildfire_heat, industrial_ir]
    capabilities: [color_grading, rgb_enhancement]
    performance_profile:
      typical_inference_time_ms: 12
      typical_accuracy_f1: 0.28
      false_positive_rate: 0.37
      false_negative_rate: 0.43
      throughput_fps: 34
      robustness_notes: >
        It runs as a valid pipeline, but the produced images discard the thermal
        semantics that the rest of the V21 stack depends on.
    resource_profile:
      min_compute_cpu: 1.5
      min_memory_mb: 512
      min_storage_mb: 128
      recommended_accelerator: none
      model_size_mb: 10

  - implementation_id: aerial_rgb_thermal_aligner_v2
    service_type: multi_spectral_fusion_preprocessing
    model_family: homography_fusion
    model_version: v2
    semantic_variant_type: exact
    compatible_node_types: [rsu, edge_server, cloud_server]
    semantic_profile:
      description: >
        This fusion preprocessor aligns RGB and thermal streams from a shared
        aerial platform, compensates for small mounting offsets, and builds a
        fused scene tensor ready for joint reasoning.
      input_semantic: >
        It expects time synchronized RGB and thermal frames with camera pose
        metadata or enough overlap for robust geometric registration.
      output_semantic: >
        It returns a co-registered multispectral representation where heat and
        visible structure refer to the same scene points.
    domain:
      primary_domains: [multispectral, aerial, wildfire]
      secondary_domains: [industrial_inspection, night_monitoring]
      unsuitable_domains: [single_sensor_only, document_scan, audio]
    capabilities: [sensor_alignment, rgb_thermal_fusion, registration]
    performance_profile:
      typical_inference_time_ms: 31
      typical_accuracy_f1: 0.93
      false_positive_rate: 0.04
      false_negative_rate: 0.05
      throughput_fps: 16
      robustness_notes: >
        It is accurate when timestamps are tight, but large sensor desync still
        causes spatial drift around fast moving objects.
    resource_profile:
      min_compute_cpu: 4.0
      min_memory_mb: 2048
      min_storage_mb: 512
      recommended_accelerator: gpu
      model_size_mb: 48

  - implementation_id: multispectral_patch_fuser_v1
    service_type: multi_spectral_fusion_preprocessing
    model_family: transformer_fuser
    model_version: v1
    semantic_variant_type: equivalent
    compatible_node_types: [edge_server, cloud_server]
    semantic_profile:
      description: >
        This patch based transformer learns to fuse visible, near infrared, and
        thermal cues into a single representation, serving the same purpose as
        classical alignment pipelines but with heavier compute.
      input_semantic: >
        It expects already cropped sensor patches or moderately aligned frames
        where the model can learn cross channel correspondences.
      output_semantic: >
        It emits a fused feature image whose channels emphasize anomalies that
        are weak in one modality but strong in another.
    domain:
      primary_domains: [multispectral, transformer_fusion]
      secondary_domains: [wildfire, industrial_inspection]
      unsuitable_domains: [low_memory_uav, single_rgb, text_images]
    capabilities: [feature_fusion, multispectral_preprocess, anomaly_boost]
    performance_profile:
      typical_inference_time_ms: 54
      typical_accuracy_f1: 0.91
      false_positive_rate: 0.05
      false_negative_rate: 0.06
      throughput_fps: 9
      robustness_notes: >
        It preserves subtle cross modality cues well, but deployment is mostly
        limited to stronger edge or cloud nodes.
    resource_profile:
      min_compute_cpu: 6.0
      min_memory_mb: 4096
      min_storage_mb: 1024
      recommended_accelerator: gpu
      model_size_mb: 86

  - implementation_id: georegistered_sensor_stack_v3
    service_type: multi_spectral_fusion_preprocessing
    model_family: ros_sensor_stack
    model_version: v3
    semantic_variant_type: compatible
    compatible_node_types: [rsu, edge_server]
    semantic_profile:
      description: >
        This stack fuses heterogeneous sensors through timestamp and GPS based
        registration, which makes it broadly usable when tight pixel alignment
        is not required.
      input_semantic: >
        It expects sensor packets with reliable timing, approximate geolocation,
        and scene overlap that is good enough for coarse alignment.
      output_semantic: >
        It returns a loosely fused observation package where each modality is
        linked in time and space but not always pixel perfect.
    domain:
      primary_domains: [multisensor, georegistration]
      secondary_domains: [traffic, security, inspection]
      unsuitable_domains: [subpixel_defect_analysis, document_ocr]
    capabilities: [timestamp_alignment, geo_registration, sensor_packaging]
    performance_profile:
      typical_inference_time_ms: 23
      typical_accuracy_f1: 0.84
      false_positive_rate: 0.08
      false_negative_rate: 0.09
      throughput_fps: 18
      robustness_notes: >
        It is operationally flexible, but coarse alignment reduces value for
        pixel precise downstream reasoning.
    resource_profile:
      min_compute_cpu: 3.0
      min_memory_mb: 1536
      min_storage_mb: 512
      recommended_accelerator: none
      model_size_mb: 24

  - implementation_id: dual_camera_parking_fusion_v1
    service_type: multi_spectral_fusion_preprocessing
    model_family: stereo_parking_fusion
    model_version: v1
    semantic_variant_type: weak
    compatible_node_types: [rsu, edge_server]
    semantic_profile:
      description: >
        This fusion pipeline was designed for fixed dual camera parking systems
        and can combine two views, but its geometry assumptions break down when
        sensors move together on an airborne platform.
      input_semantic: >
        It expects near static paired RGB cameras with constant baseline and a
        narrow operating region such as a gate or parking aisle.
      output_semantic: >
        It produces a fused dual view frame that is convenient for local scene
        monitoring, yet it does not preserve reliable airborne registration.
    domain:
      primary_domains: [parking_monitoring, dual_camera]
      secondary_domains: [fixed_security]
      unsuitable_domains: [aerial_multispectral, wildfire, thermal_registration]
    capabilities: [dual_view_fusion, scene_pair_alignment]
    performance_profile:
      typical_inference_time_ms: 18
      typical_accuracy_f1: 0.73
      false_positive_rate: 0.12
      false_negative_rate: 0.15
      throughput_fps: 22
      robustness_notes: >
        It is acceptable only when motion is low and the view geometry remains
        close to its fixed camera training setup.
    resource_profile:
      min_compute_cpu: 2.0
      min_memory_mb: 1024
      min_storage_mb: 256
      recommended_accelerator: none
      model_size_mb: 17

  - implementation_id: single_stream_frame_cropper_v2
    service_type: multi_spectral_fusion_preprocessing
    model_family: crop_resize_pipeline
    model_version: v2
    semantic_variant_type: mismatch
    compatible_node_types: [uav, rsu]
    semantic_profile:
      description: >
        This pipeline only crops and resizes one stream, so it cannot express
        any true fusion semantics even though it may run before a model.
      input_semantic: >
        It expects a single RGB stream and a crop template rather than multiple
        synchronized sensors with complementary evidence.
      output_semantic: >
        It emits resized single modality frames that carry no cross sensor
        alignment or fused representation for downstream consumers.
    domain:
      primary_domains: [single_stream_preprocess, rgb]
      secondary_domains: [generic_video]
      unsuitable_domains: [multispectral, thermal_rgb_fusion, industrial_fusion]
    capabilities: [crop_resize, frame_normalization]
    performance_profile:
      typical_inference_time_ms: 6
      typical_accuracy_f1: 0.24
      false_positive_rate: 0.39
      false_negative_rate: 0.46
      throughput_fps: 60
      robustness_notes: >
        It is very fast, but its outputs miss the defining semantics of this
        service type and therefore should score near the bottom.
    resource_profile:
      min_compute_cpu: 1.0
      min_memory_mb: 256
      min_storage_mb: 128
      recommended_accelerator: none
      model_size_mb: 4

  - implementation_id: fire_rgb_yolov8_v3
    service_type: fire_candidate_detection
    model_family: yolov8
    model_version: v3
    semantic_variant_type: exact
    compatible_node_types: [uav, rsu, edge_server]
    semantic_profile:
      description: >
        This detector is tuned for aerial wildfire patrol and searches for both
        compact flame regions and early smoke plumes in RGB frames before any
        event verification logic is applied.
      input_semantic: >
        It expects stabilized daylight RGB aerial imagery with enough ground
        detail to resolve small flame textures and drifting smoke structure.
      output_semantic: >
        It returns fire and smoke candidate boxes with confidence scores and
        coarse plume direction cues for downstream fusion or verification.
    domain:
      primary_domains: [wildfire, aerial, rgb]
      secondary_domains: [grassfire, hillside_monitoring]
      unsuitable_domains: [indoor_flame, traffic, biometric]
    capabilities: [fire_detection, smoke_detection, object_localization]
    performance_profile:
      typical_inference_time_ms: 37
      typical_accuracy_f1: 0.93
      false_positive_rate: 0.05
      false_negative_rate: 0.06
      throughput_fps: 21
      robustness_notes: >
        It is strong in daylight aerial scenes, but dense cloud shadow or heavy
        smoke occlusion can still reduce recall.
    resource_profile:
      min_compute_cpu: 4.0
      min_memory_mb: 2048
      min_storage_mb: 512
      recommended_accelerator: gpu
      model_size_mb: 52

  - implementation_id: wildfire_thermal_seg_v2
    service_type: fire_candidate_detection
    model_family: deeplabv3
    model_version: v2
    semantic_variant_type: equivalent
    compatible_node_types: [rsu, edge_server, cloud_server]
    semantic_profile:
      description: >
        This thermal segmentation model searches for persistent hot regions and
        works as an equivalent fire candidate detector when visible cues are weak
        or the mission runs at night.
      input_semantic: >
        It expects calibrated thermal frames whose pixel values still preserve
        relative heat intensity around suspected flame regions.
      output_semantic: >
        It emits segmented hot regions with confidence and area estimates, which
        can feed verification even without explicit smoke boxes.
    domain:
      primary_domains: [wildfire, thermal, night_monitoring]
      secondary_domains: [industrial_heat, aerial]
      unsuitable_domains: [rgb_only, urban_identity, traffic_tracking]
    capabilities: [thermal_fire_segmentation, hotspot_detection]
    performance_profile:
      typical_inference_time_ms: 44
      typical_accuracy_f1: 0.9
      false_positive_rate: 0.06
      false_negative_rate: 0.07
      throughput_fps: 14
      robustness_notes: >
        It is useful at night, but hot machinery and sun warmed roofs can raise
        false positives if location context is absent.
    resource_profile:
      min_compute_cpu: 5.0
      min_memory_mb: 3072
      min_storage_mb: 768
      recommended_accelerator: gpu
      model_size_mb: 61

  - implementation_id: smoke_rgb_retinanet_v1
    service_type: fire_candidate_detection
    model_family: retinanet
    model_version: v1
    semantic_variant_type: compatible
    compatible_node_types: [rsu, edge_server]
    semantic_profile:
      description: >
        This model focuses on smoke plumes rather than direct flame evidence, so
        it is compatible with wildfire early warning but not the most complete
        fire candidate detector.
      input_semantic: >
        It expects stabilized RGB aerial imagery with enough sky or background
        contrast for smoke shape to remain visible across frames.
      output_semantic: >
        It produces smoke candidate boxes and confidence values that help early
        warning logic, but it leaves flame confirmation to later stages.
    domain:
      primary_domains: [smoke, aerial, wildfire]
      secondary_domains: [early_warning, hillside_monitoring]
      unsuitable_domains: [indoor_flame, person_reid, defect_inspection]
    capabilities: [smoke_detection, object_localization]
    performance_profile:
      typical_inference_time_ms: 33
